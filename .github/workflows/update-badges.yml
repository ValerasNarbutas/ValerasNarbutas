name: Update badges

on:
  schedule:
    # Runs at 0am UTC every day
    - cron: "0 0 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
jobs:
  update-readme:
    name: Update Readme with badges
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Badges - Readme
        uses: pemtajo/badge-readme@main
        with:
          GH_TOKEN: ${{ secrets.VALERAS_NARBUTAS }}
          COMMIT_MESSAGE: "My commit message to update badges" # optional
          CREDLY_USER: valeras-narbutas # optional, but default will use the same from github
          NUMBER_LAST_BADGES: 0

      - name: Normalize badge display sizes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set fixed badge dimensions
        run: |
          python - <<'PY'
          import html
          import re
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          start = "<!--START_SECTION:badges-->"
          end = "<!--END_SECTION:badges-->"

          if start not in content or end not in content:
              raise SystemExit("Badge section markers are missing from README.md")

          before, section_and_after = content.split(start, 1)
          section, after = section_and_after.split(end, 1)
          badge_pattern = re.compile(
              r"\[!\[(?P<alt>.*?)\]\((?P<src>https://images\.credly\.com/[^)]+)\)"
              r"\]\((?P<link>https://www\.credly\.com/badges/[^)]+)\)"
          )

          def fixed_size_badge(match):
              alt = html.escape(match.group("alt"), quote=True)
              src = html.escape(match.group("src"), quote=True)
              link = html.escape(match.group("link"), quote=True)
              return (
                  f'<a href="{link}"><img src="{src}" alt="{alt}" '
                  'width="80" height="80" /></a>'
              )

          normalized, count = badge_pattern.subn(fixed_size_badge, section)
          if count == 0 and section.strip():
              raise SystemExit("No Credly badges found in the generated badge section")

          updated = before + start + normalized + end + after
          if updated != content:
              readme.write_text(updated, encoding="utf-8")
          print(f"Normalized {count} Credly badge images")
          PY

      - name: Commit normalized badges
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Normalize Credly badge display sizes"
            git push
          fi
